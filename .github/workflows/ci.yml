name: RFA CI

on:
  push:
    branches:
      - rfa-v2-optimized
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Prepare source package
        run: |
          mkdir -p package/Remote_Firing_Analyzer_v2_Optimized
          rsync -a ./ package/Remote_Firing_Analyzer_v2_Optimized/ \
            --exclude .git \
            --exclude node_modules \
            --exclude .next \
            --exclude out \
            --exclude package
          cd package
          zip -qr ../Remote_Firing_Analyzer_v2_Optimized.zip Remote_Firing_Analyzer_v2_Optimized

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Remote_Firing_Analyzer_v2_Optimized
          path: Remote_Firing_Analyzer_v2_Optimized.zip
          if-no-files-found: error
          retention-days: 7
